name: Optional autodiff backend

on:
  push:
    branches: [main, "research/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  torch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12.8"
      - name: Install optional autodiff dependency
        run: python -m pip install --require-hashes -r requirements-autodiff-py312-linux.lock
      - name: Record reproducibility manifest
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/write_repro_manifest.py --lock requirements-autodiff-py312-linux.lock --output neural-operator-reproducibility-manifest.json
          cp requirements-autodiff-py312-linux.lock neural-operator-autodiff-py312-linux.lock
      - name: Run optional backend tests
        run: PYTHONPATH=src python -m unittest discover -s tests -p "test_torch_*.py" -v
      - name: Run controlled operator benchmark
        run: |
          PYTHONPATH=src python scripts/torch_operator_comparison.py > controlled-operator-benchmark.json
          cat controlled-operator-benchmark.json
      - name: Run differentiable transition PINO benchmark
        run: |
          PYTHONPATH=src python scripts/torch_pino_experiment.py > torch-pino-benchmark.json
          cat torch-pino-benchmark.json
      - name: Run Darcy FNO 2D benchmark
        run: |
          PYTHONPATH=src python scripts/torch_darcy_fno2d_experiment.py > torch-darcy-fno2d-benchmark.json
          cat torch-darcy-fno2d-benchmark.json
      - name: Run matched-budget Darcy operator comparison
        run: |
          PYTHONPATH=src python scripts/torch_darcy_operator_comparison.py > torch-darcy-operator-comparison.json
          cat torch-darcy-operator-comparison.json
      - name: Run matched-budget full tensor Darcy operator comparison
        run: |
          PYTHONPATH=src python scripts/torch_darcy_tensor_operator_comparison.py > torch-darcy-tensor-operator-comparison.json
          cat torch-darcy-tensor-operator-comparison.json
      - name: Run multi-seed full tensor Darcy replication
        run: |
          PYTHONPATH=src python scripts/torch_darcy_tensor_multiseed.py > torch-darcy-tensor-multiseed.json
          cat torch-darcy-tensor-multiseed.json
      - name: Run Darcy physics-weight sweep
        run: |
          PYTHONPATH=src python scripts/torch_darcy_pino_experiment.py > torch-darcy-pino-benchmark.json
          cat torch-darcy-pino-benchmark.json
      - name: Run Darcy multi-seed sample scaling
        run: |
          PYTHONPATH=src python scripts/torch_darcy_multiseed_scaling.py > torch-darcy-multiseed-scaling.json
          cat torch-darcy-multiseed-scaling.json
      - name: Run Darcy coefficient-family OOD study
        run: |
          PYTHONPATH=src python scripts/torch_darcy_ood_families.py > torch-darcy-ood-families.json
          cat torch-darcy-ood-families.json
      - name: Run Darcy PINO resolution sensitivity
        run: |
          PYTHONPATH=src python scripts/torch_darcy_pino_resolution.py > torch-darcy-pino-resolution.json
          cat torch-darcy-pino-resolution.json
      - name: Run exact Darcy scale-equivariance benchmark
        run: |
          PYTHONPATH=src python scripts/torch_darcy_scale_equivariance.py > torch-darcy-scale-equivariance.json
          cat torch-darcy-scale-equivariance.json
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: neural-operator-benchmarks
          path: |
            *.json
            *.lock
          if-no-files-found: error
          retention-days: 14
      - name: Compile Python modules
        run: python -m compileall -q src tests scripts
