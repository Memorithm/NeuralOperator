name: Optional autodiff backend

on:
  push:
    branches: [main, "research/**"]
    paths:
      - "src/neural_operator_reference/torch_fno1d.py"
      - "src/neural_operator_reference/torch_fno2d.py"
      - "src/neural_operator_reference/torch_deeponet.py"
      - "src/neural_operator_reference/torch_deeponet2d.py"
      - "src/neural_operator_reference/torch_localconv2d.py"
      - "src/neural_operator_reference/benchmarking.py"
      - "src/neural_operator_reference/torch_physics.py"
      - "src/neural_operator_reference/torch_darcy_physics.py"
      - "scripts/torch_pino_experiment.py"
      - "scripts/torch_darcy_pino_experiment.py"
      - "scripts/torch_darcy_multiseed_scaling.py"
      - "scripts/torch_darcy_ood_families.py"
      - "scripts/torch_darcy_pino_resolution.py"
      - "src/neural_operator_reference/evaluation.py"
      - "scripts/torch_operator_comparison.py"
      - "scripts/torch_darcy_fno2d_experiment.py"
      - "scripts/torch_darcy_operator_comparison.py"
      - "tests/test_torch_fno.py"
      - "tests/test_torch_fno2d.py"
      - "tests/test_torch_darcy_comparison.py"
      - "tests/test_torch_deeponet.py"
      - "tests/test_torch_benchmarking.py"
      - "tests/test_torch_physics.py"
      - "tests/test_torch_darcy_physics.py"
      - "tests/test_evaluation.py"
      - "requirements-autodiff.txt"
      - ".github/workflows/optional-autodiff.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/neural_operator_reference/torch_fno1d.py"
      - "src/neural_operator_reference/torch_fno2d.py"
      - "src/neural_operator_reference/benchmarking.py"
      - "src/neural_operator_reference/darcy.py"
      - "src/neural_operator_reference/darcy_datasets.py"
      - "scripts/torch_darcy_fno2d_experiment.py"
      - "tests/test_torch_fno2d.py"
      - "src/neural_operator_reference/torch_deeponet.py"
      - "src/neural_operator_reference/torch_deeponet2d.py"
      - "src/neural_operator_reference/torch_localconv2d.py"
      - "src/neural_operator_reference/torch_darcy_physics.py"
      - "scripts/torch_darcy_operator_comparison.py"
      - "scripts/torch_darcy_pino_experiment.py"
      - "scripts/torch_darcy_multiseed_scaling.py"
      - "scripts/torch_darcy_ood_families.py"
      - "scripts/torch_darcy_pino_resolution.py"
      - "src/neural_operator_reference/darcy_datasets.py"
      - "tests/test_darcy_ood_families.py"
      - "tests/test_torch_darcy_comparison.py"
      - "tests/test_torch_darcy_physics.py"
      - "tests/test_torch_fno.py"
      - "tests/test_torch_deeponet.py"
      - "requirements-autodiff.txt"
      - ".github/workflows/optional-autodiff.yml"

permissions:
  contents: read

jobs:
  torch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional autodiff dependency
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-autodiff.txt
      - name: Run optional backend tests
        run: PYTHONPATH=src python -m unittest discover -s tests -p "test_torch_*.py" -v
      - name: Run controlled operator benchmark
        run: |
          PYTHONPATH=src python scripts/torch_operator_comparison.py > controlled-operator-benchmark.json
          cat controlled-operator-benchmark.json
      - name: Run differentiable transition PINO benchmark
        run: |
          PYTHONPATH=src python scripts/torch_pino_experiment.py > torch-pino-benchmark.json
          cat torch-pino-benchmark.json
      - name: Run Darcy FNO 2D benchmark
        run: |
          PYTHONPATH=src python scripts/torch_darcy_fno2d_experiment.py > torch-darcy-fno2d-benchmark.json
          cat torch-darcy-fno2d-benchmark.json
      - name: Run matched-budget Darcy operator comparison
        run: |
          PYTHONPATH=src python scripts/torch_darcy_operator_comparison.py > torch-darcy-operator-comparison.json
          cat torch-darcy-operator-comparison.json
      - name: Run Darcy physics-weight sweep
        run: |
          PYTHONPATH=src python scripts/torch_darcy_pino_experiment.py > torch-darcy-pino-benchmark.json
          cat torch-darcy-pino-benchmark.json
      - name: Run Darcy multi-seed sample scaling
        run: |
          PYTHONPATH=src python scripts/torch_darcy_multiseed_scaling.py > torch-darcy-multiseed-scaling.json
          cat torch-darcy-multiseed-scaling.json
      - name: Run Darcy coefficient-family OOD study
        run: |
          PYTHONPATH=src python scripts/torch_darcy_ood_families.py > torch-darcy-ood-families.json
          cat torch-darcy-ood-families.json
      - name: Run Darcy PINO resolution sensitivity
        run: |
          PYTHONPATH=src python scripts/torch_darcy_pino_resolution.py > torch-darcy-pino-resolution.json
          cat torch-darcy-pino-resolution.json
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: neural-operator-benchmarks
          path: "*.json"
          if-no-files-found: error
          retention-days: 14
      - name: Compile Python modules
        run: python -m compileall -q src tests scripts
