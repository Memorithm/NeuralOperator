name: Tests

on:
  push:
    branches: [main, "research/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12.8"
      - name: Install numerical dependency
        run: python -m pip install --require-hashes -r requirements-py312-linux.lock
      - name: Record reproducibility manifest
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/write_repro_manifest.py --lock requirements-py312-linux.lock --output neural-operator-reproducibility-manifest.json
          cp requirements-py312-linux.lock neural-operator-py312-linux.lock
      - name: Upload reproducibility evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: neural-operator-reproducibility-${{ github.sha }}
          path: |
            neural-operator-reproducibility-manifest.json
            neural-operator-py312-linux.lock
          if-no-files-found: error
          retention-days: 90
      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Compile Python modules
        run: python -m compileall -q src tests scripts
